name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TARGET: x86_64-unknown-linux-musl
  RUST_TOOLCHAIN: 1.92.0

jobs:
  quality:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          if [[ "$VERSION" == "$version" || "$version" == *+* ]]; then
            printf 'invalid release tag: %s\n' "$VERSION" >&2
            exit 1
          fi

          core="${version%%-*}"
          IFS='.' read -r -a core_parts <<< "$core"
          if (( ${#core_parts[@]} != 3 )); then
            printf 'release tag must be vMAJOR.MINOR.PATCH[-PRERELEASE]: %s\n' "$VERSION" >&2
            exit 1
          fi
          for part in "${core_parts[@]}"; do
            if [[ ! "$part" =~ ^(0|[1-9][0-9]*)$ ]]; then
              printf 'invalid release number in tag: %s\n' "$VERSION" >&2
              exit 1
            fi
          done

          if [[ "$version" == *-* ]]; then
            prerelease="${version#*-}"
            if [[ -z "$prerelease" ]]; then
              printf 'prerelease identifier must not be empty: %s\n' "$VERSION" >&2
              exit 1
            fi
            IFS='.' read -r -a prerelease_parts <<< "$prerelease"
            for part in "${prerelease_parts[@]}"; do
              if [[ -z "$part" || ! "$part" =~ ^[0-9A-Za-z-]+$ || "$part" =~ ^0[0-9]+$ ]]; then
                printf 'invalid prerelease identifier in tag: %s\n' "$VERSION" >&2
                exit 1
              fi
            done
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.24.x
          cache: true
          cache-dependency-path: |
            go.sum
            examples/cookbook/go.sum

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --component clippy,rustfmt \
            --target "$RUST_TARGET"
          rustup default "$RUST_TOOLCHAIN"

      - name: Check formatting
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          cargo fmt --all --check

      - name: Run Go tests
        run: |
          go test ./...
          go -C examples/cookbook test ./...

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Run Rust lint
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          RUSTFLAGS='-C linker=rust-lld' \
            cargo clippy --workspace --all-targets \
            --target "$RUST_TARGET" -- -D warnings

  linux-integration:
    name: Runtime image and Linux integration
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.24.x
          cache: true

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --target "$RUST_TARGET"
          rustup default "$RUST_TOOLCHAIN"

      - name: Build static runtime binaries
        env:
          RUSTFLAGS: -C linker=rust-lld
        run: |
          mkdir -p out
          cargo build --workspace --release --target "$RUST_TARGET"
          install -m 0755 "target/$RUST_TARGET/release/campd" out/campd
          install -m 0755 "target/$RUST_TARGET/release/sandrun" out/sandrun

      - name: Build Linux images
        run: |
          docker build --platform linux/amd64 \
            -t sandcamp-fastapi-proxy:local \
            test/image-volume/fastapi-proxy
          docker build --platform linux/amd64 \
            -t sandcamp-egress:local \
            test/image-volume/egress
          docker build --platform linux/amd64 \
            -t sandcamp-runtime:local \
            -f images/runtime/Dockerfile .
          docker build --platform linux/amd64 --target root \
            -t sandcamp-validation-main:root-local \
            validation/fixtures/main
          docker build --platform linux/amd64 --target nonroot \
            -t sandcamp-validation-main:nonroot-local \
            validation/fixtures/main

      - name: Test sandrun on Linux
        env:
          SANDRUN_BIN: ${{ github.workspace }}/out/sandrun
        run: bash ./scripts/test-sandrun-linux.sh

      - name: Test the root stack
        env:
          SCENARIO: root
        run: bash ./scripts/test-stack-linux.sh

      - name: Test the non-root stack
        env:
          SCENARIO: nonroot
        run: bash ./scripts/test-stack-linux.sh

      - name: Upload tested runtime binaries
        if: >-
          github.repository == 'TencentCloudAgentRuntime/sandcamp' &&
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandcamp-runtime-linux-amd64
          path: |
            out/campd
            out/sandrun
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-runtime:
    name: Publish runtime image
    needs: linux-integration
    if: >-
      github.repository == 'TencentCloudAgentRuntime/sandcamp' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download tested runtime binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sandcamp-runtime-linux-amd64
          path: out

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/tencentcloudagentruntime/sandcamp-runtime
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=long,prefix=sha-
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-beta') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Sandcamp runtime bundle
            org.opencontainers.image.description=campd, sandrun, and the restricted launcher for a Sandcamp Runtime Image Volume
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and publish runtime image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/runtime/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=sandcamp-runtime
          cache-to: type=gha,mode=max,scope=sandcamp-runtime
          provenance: false

      - name: Record published image
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          printf '### Runtime image published\n\n' >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r tag; do
            printf -- '- `%s`\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$TAGS"
          printf -- '- Digest: `%s`\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
