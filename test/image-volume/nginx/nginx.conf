events {}

http {
    access_log /dev/stdout;
    error_log /dev/stderr info;

    server {
        listen 19080;

        location = /nginx-health {
            add_header Content-Type text/plain;
            return 200 "nginx-ok\n";
        }

        location / {
            proxy_pass http://127.0.0.1:18082;
            proxy_set_header Host $host;
        }
    }
}
